<!DOCTYPE html>
<html>
<head>
  <title>CORSProxy.io Browser</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial; padding: 20px; }
    input { width: 80%; padding: 10px; }
    button { padding: 10px 20px; }
    #viewer { width: 100%; height: 80vh; margin-top: 20px; }
    iframe { width: 100%; height: 100%; border: 1px solid #ccc; }
    pre { white-space: pre-wrap; padding: 10px; background: #eee; height:100%; overflow:auto; }
  </style>
</head>
<body>

<h2>CORSProxy.io Browser</h2>

<input id="urlInput" placeholder="Enter a URL (https://example.com)">
<button onclick="loadSite()">Load</button>

<select id="mode">
  <option value="html">Show Raw HTML</option>
  <option value="sandbox">Sandboxed Preview</option>
</select>

<div id="viewer"></div>

<script>
async function loadSite() {
  const url = document.getElementById("urlInput").value.trim();
  const mode = document.getElementById("mode").value;
  const viewer = document.getElementById("viewer");

  if (!url) {
    alert("Enter a URL first.");
    return;
  }

  const proxied = "https://corsproxy.io/?" + encodeURIComponent(url);

  viewer.innerHTML = "<p>Loading...</p>";

  try {
    const res = await fetch(proxied);
    const text = await res.text();

    if (mode === "html") {
      // show raw HTML safely
      viewer.innerHTML = "<pre></pre>";
      viewer.querySelector("pre").textContent = text;
    } else {
      // sandbox the HTML so scripts can't run
      const blob = new Blob([text], { type: "text/html" });
      const blobURL = URL.createObjectURL(blob);
      viewer.innerHTML = `<iframe sandbox="allow-same-origin" src="${blobURL}"></iframe>`;
    }

  } catch (err) {
    viewer.innerHTML = "<p>Error: " + err + "</p>";
  }
}
</script>

</body>
</html>
