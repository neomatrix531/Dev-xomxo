<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elproxy - Web Proxy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="home-button" class="home-button">Home</button>
  <button id="settings-button" class="settings-button">Settings</button>
  <button id="ext-hanger-button" class="ext-hanger-button">ExtHanger</button>
  <div class="proxy-container">
    <h1 class="logo">Elproxy</h1>
    <form class="search-bar search-form">
      <select id="search-engine" class="search-engine-select">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="bing">Bing</option>
        <option value="yahoo">Yahoo</option>
      </select>
      <input 
        type="text" 
        class="search-input" 
        placeholder="Enter URL to proxy..."
        autocomplete="off"
        autofocus
      >
      <button type="submit" class="search-button">Go</button>
    </form>
    <div class="creator-text">Made by GlitchForge</div>
  </div>
  <div class="settings-container">
    <h2 class="settings-title">Settings</h2>
    
    <div class="settings-option">
      <label class="settings-label" for="tab-cloak">Tab Cloak</label>
      <select id="tab-cloak" class="settings-select">
        <option value="none">No Cloak</option>
        <option value="classroom">Google Classroom</option>
        <option value="docs">Google Docs</option>
        <option value="blank">about:blank</option>
      </select>
    </div>

    <div class="settings-option">
      <label class="settings-label" for="blank-open">Open in about:blank</label>
      <button id="blank-open" class="settings-select">Open Current Page in about:blank</button>
    </div>

    <div class="settings-option">
      <label class="settings-label" for="bg-color">Background Color</label>
      <input type="color" id="bg-color" class="color-picker" value="#1a1a1a">
    </div>

    <div class="settings-option">
      <label class="settings-label" for="button-color">Button Color</label>
      <input type="color" id="button-color" class="color-picker" value="#ff0000">
    </div>

    <div class="settings-button-group">
      <button id="settings-save" class="settings-save">Save</button>
      <button id="settings-cancel" class="settings-cancel">Cancel</button>
    </div>
  </div>
  <iframe 
    id="proxy-frame" 
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
  ></iframe>
  <script src="background.js"></script>
  <script src="starfield.js"></script>
  <script src="main.js"></script>
</body>
</html>
