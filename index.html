<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XOMXO</title>
  <style>
    :root{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;}
    body{margin:0;background:#f6f7fb;color:#111}
    header{display:flex;gap:8px;padding:10px;background:#0b1220;color:#fff;align-items:center}
    input[type=text]{flex:1;padding:8px 10px;border-radius:8px;border:0;font-size:14px}
    button{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff;cursor:pointer}
    main{display:flex;gap:12px;padding:12px}
    #left{width:45%;display:flex;flex-direction:column}
    #right{flex:1;display:flex;flex-direction:column}
    textarea{flex:1;border-radius:8px;padding:12px;font-family:monospace;border:1px solid #ddd;resize:vertical}
    iframe{flex:1;border-radius:8px;border:1px solid #ccc}
    .toolbar{display:flex;gap:8px;align-items:center}
    .muted{color:#9aa3b2;font-size:13px}
    .status{font-size:13px;margin-left:8px}
  </style>
</head>
<body>
  <header>
    <div class="toolbar">
      <button id="backBtn" title="Back">◀</button>
      <button id="forwardBtn" title="Forward">▶</button>
      <button id="reloadBtn" title="Reload">⟳</button>
    </div>
    <input id="address" type="text" placeholder="Enter URL (e.g. https://example.com)" value="https://browser.lol/vm" />
    <button id="goBtn">Go</button>
    <div class="muted status" id="status">Ready</div>
  </header>

  <main>
    <div id="left">
      <label class="muted">Raw HTML</label>
      <textarea id="raw" readonly placeholder="Raw HTML will appear here..."></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;">
        <button id="downloadBtn">Download HTML</button>
        <button id="openNewTabBtn">Open in new tab</button>
      </div>
    </div>
    <div id="right">
      <label class="muted">Rendered View</label>
      <iframe id="preview"></iframe>
    </div>
  </main>

  <script>
    // Simple "browser" that fetches pages via corsproxy.io and displays them fully.
    const address = document.getElementById('address');
    const goBtn = document.getElementById('goBtn');
    const backBtn = document.getElementById('backBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const rawOut = document.getElementById('raw');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    const openNewTabBtn = document.getElementById('openNewTabBtn');

    let historyStack = [];
    let historyIndex = -1;
    let currentBlobUrl = null;

    function updateNavButtons() {
      backBtn.disabled = historyIndex <= 0;
      forwardBtn.disabled = historyIndex >= historyStack.length - 1 || historyIndex === -1;
    }

    function setStatus(txt) { status.textContent = txt; }

    function normalizeUrl(u) {
      u = u.trim();
      if (!u) return '';
      // If no scheme, assume https
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      return u;
    }

    function corsProxyFetchUrl(target) {
      // Use encoded target to avoid issues
      return 'https://corsproxy.io/?' + encodeURIComponent(target);
    }

    async function fetchAndRender(target) {
      const url = normalizeUrl(target);
      if (!url) return alert('Enter a URL');
      setStatus('Fetching ' + url + ' via corsproxy.io...');
      try {
        const proxyUrl = corsProxyFetchUrl(url);
        const res = await fetch(proxyUrl, {cache: 'no-store'});
        if (!res.ok) throw new Error('Proxy returned ' + res.status + ' ' + res.statusText);
        const html = await res.text();
        rawOut.value = html;

        // Clean up previous blob
        if (currentBlobUrl) {
          try { URL.revokeObjectURL(currentBlobUrl); } catch(e){}
          currentBlobUrl = null;
        }

        // Create blob so the page renders with its full HTML (scripts/styles execute)
        const blob = new Blob([html], {type: 'text/html'});
        currentBlobUrl = URL.createObjectURL(blob);
        preview.src = currentBlobUrl;

        // Manage history
        // If navigating to a new URL (not via back/forward), push into history
        if (historyIndex === -1 || historyStack[historyIndex] !== url) {
          historyStack = historyStack.slice(0, historyIndex + 1);
          historyStack.push(url);
          historyIndex = historyStack.length - 1;
        }
        address.value = url;
        updateNavButtons();
        setStatus('Loaded ' + url);
      } catch (err) {
        rawOut.value = 'Error: ' + (err && err.message ? err.message : String(err));
        setStatus('Error');
      }
    }

    goBtn.addEventListener('click', () => fetchAndRender(address.value));
    address.addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchAndRender(address.value); });

    backBtn.addEventListener('click', () => {
      if (historyIndex > 0) {
        historyIndex -= 1;
        setStatus('Loading ' + historyStack[historyIndex]);
        fetchAndRender(historyStack[historyIndex]);
      }
    });

    forwardBtn.addEventListener('click', () => {
      if (historyIndex < historyStack.length - 1) {
        historyIndex += 1;
        setStatus('Loading ' + historyStack[historyIndex]);
        fetchAndRender(historyStack[historyIndex]);
      }
    });

    reloadBtn.addEventListener('click', () => {
      if (historyIndex === -1) return fetchAndRender(address.value);
      fetchAndRender(historyStack[historyIndex]);
    });

    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([rawOut.value || ''], {type: 'text/html'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (new URL(normalizeUrl(address.value))).hostname.replace(/[^a-z0-9-.]/gi,'') + '.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    openNewTabBtn.addEventListener('click', () => {
      if (!currentBlobUrl) return alert('No page loaded');
      window.open(currentBlobUrl, '_blank');
    });

    // Initial load
    fetchAndRender(address.value);
  </script>
