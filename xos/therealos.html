<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XomxoOS</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #4b6cb7, #182848);
      height: 100vh;
      overflow: hidden;
      color: white;
      transition: background 0.3s, color 0.3s;
    }

    body.dark {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #eaeaea;
    }

    /* Desktop */
    #desktop {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Dock */
    #dock {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      gap: 12px;
    }

    body.dark #dock {
      background: rgba(20,20,20,0.7);
    }

    .dock-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .dock-btn:hover { background: rgba(255,255,255,0.25); }

    /* Windows */
    .window {
      position: absolute;
      top: 80px;
      left: 80px;
      width: 70%;
      height: 70%;
      background: #111;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      display: none;
    }

    .titlebar {
      height: 42px;
      background: linear-gradient(180deg, #2b2b2b, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: move;
    }

    .titlebar span { font-weight: 600; }

    .controls button {
      background: #ff5f57;
      border: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: calc(100% - 42px);
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <div id="desktop">

    <!-- Penguinmod App -->
    <div class="window" id="penguinmod">
      <div class="titlebar">
        <span>Penguinmod</span>
        <div class="controls">
          <button onclick="closeWindow('penguinmod')"></button>
        </div>
      </div>
      <iframe src="https://penguinmod.com"></iframe>
    </div>

    <!-- XomxoProxy App -->
    <div class="window" id="xomxoproxy" style="top:120px;left:120px;">
      <div class="titlebar">
        <span>XomxoProxy</span>
        <div class="controls">
          <button onclick="closeWindow('xomxoproxy')"></button>
        </div>
      </div>
      <iframe src="https://hecka-browser.vercel.app"></iframe>
    </div>

    <!-- Dock (XomxoOS) -->
    <div id="dock">
      <button class="dock-btn" onclick="toggleDarkMode()">🌓 Dark Mode</button>
      <button class="dock-btn" onclick="openWindow('penguinmod')">🐧 Penguinmod</button>
      <button class="dock-btn" onclick="openWindow('xomxoproxy')">🌐 XomxoProxy</button>
    </div>

  </div>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }

    function openWindow(id) {
      const win = document.getElementById(id);
      win.style.display = 'block';
      win.style.zIndex = Date.now();
    }

    function closeWindow(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Dragging logic
    document.querySelectorAll('.window').forEach(win => {
      const bar = win.querySelector('.titlebar');
      let offsetX = 0, offsetY = 0, dragging = false;

      bar.addEventListener('mousedown', e => {
        dragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
        win.style.zIndex = Date.now();
      });

      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      });

      document.addEventListener('mouseup', () => dragging = false);
    });
  </script>
</body>
</html>
