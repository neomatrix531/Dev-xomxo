<html lang="en">
<head>
    <script src="/static/uv/uv.bundle.js" defer></script>
    <script src="/static/uv/uv.config.js" defer></script>
    <script src="/static/register-sw.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterbottle Proxy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,400;12..96,600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* @tweakable Primary dark background */
            --primary-bg: #0a0a1f;
            /* @tweakable Secondary background */
            --secondary-bg: #1a1a3a;
            /* @tweakable Accent blue */
            --accent-blue: #3b82f6;
            /* @tweakable Light blue */
            --light-blue: #60a5fa;
            /* @tweakable Glow intensity */
            --glow-intensity: 0.3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: var(--primary-bg);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            background: linear-gradient(180deg, transparent, var(--light-blue), transparent);
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #1e3a8a, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient 5s ease infinite, float 6s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
            filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.5));
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .url-input {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            font-family: 'Bricolage Grotesque', monospace;
            background: var(--secondary-bg);
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }

        .url-input:focus {
            outline: none;
            border-color: var(--light-blue);
            box-shadow: 0 0 20px rgba(96, 165, 250, var(--glow-intensity)), 0 0 40px rgba(96, 165, 250, 0.3);
            transform: translateY(-2px);
        }

        .browse-btn {
            padding: 12px 30px;
            font-family: 'Bricolage Grotesque', sans-serif;
            background: linear-gradient(45deg, #1e3a8a, #60a5fa, #3b82f6);
            background-size: 200% 200%;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            animation: gradient 3s ease infinite;
        }

        .browse-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 25px rgba(96, 165, 250, 0.5), 0 0 30px rgba(96, 165, 250, 0.3);
        }

        .frame-container {
            width: 100%;
            height: 70vh;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--secondary-bg);
            display: none;
            box-shadow: 0 8px 32px rgba(30, 58, 138, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        #proxyFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .error-message {
            color: var(--light-blue);
            margin-top: 10px;
            font-family: monospace;
            display: none;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .tabs {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 58, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px;
            z-index: 1000;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
        }

        .tab {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.2);
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            margin-right: 5px;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: rgba(96, 165, 250, 0.3);
        }

        .tab.active {
            background: var(--accent-blue);
        }

        .tab-close {
            margin-left: 8px;
            cursor: pointer;
            opacity: 0.7;
        }

        .tab-close:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <audio id="bgAudio" loop>
        <source src="rain.mp3" type="audio/mpeg">
    </audio>
    <audio id="lofiAudio" loop>
        <source src="lofi-alarm-clock-243766.mp3" type="audio/mpeg">
    </audio>

    <div class="rain-container" id="rainContainer"></div>
    
    <div class="tabs" id="tabsContainer">
        <button class="tab active" id="newTabBtn">+ New Tab</button>
    </div>

    <div class="container">
        <h1>Waterbottle Proxy</h1>
        <div class="input-section">
            <input type="text" class="url-input" placeholder="Enter URL (e.g., https://example.com)" id="urlInput">
            <button class="browse-btn" onclick="loadProxy()">Browse</button>
            <a href="settings.html" style="color: var(--light-blue); text-decoration: none; margin-top: 10px;">
                <i class="fas fa-cog"></i> Settings
            </a>
        </div>
        <div class="error-message" id="errorMessage"></div>
        <div class="frame-container" id="frameContainer">
            <iframe id="proxyFrame"></iframe>
        </div>
    </div>

    <script>
        // UV Proxy instance
        let proxy;
        
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize UV proxy
            if (window.UV) {
                proxy = new UV.ServiceWorker();
            }

            // Audio setup
            const bgAudio = document.getElementById('bgAudio');
            const lofiAudio = document.getElementById('lofiAudio');
            
            bgAudio.volume = 0.3;
            lofiAudio.volume = 0.5;
            
            function resumeAudio() {
                if (bgAudio.paused) bgAudio.play().catch(() => {});
                if (lofiAudio.paused) lofiAudio.play().catch(() => {});
            }
            
            document.addEventListener('click', resumeAudio);
            document.addEventListener('keydown', resumeAudio);
            
            bgAudio.play().catch(() => {});
            lofiAudio.play().catch(() => {});
        });

        // Rain effect
        function createRain() {
            const rainContainer = document.getElementById('rainContainer');
            const raindropsCount = 50;

            for (let i = 0; i < raindropsCount; i++) {
                const raindrop = document.createElement('div');
                raindrop.classList.add('raindrop');
                
                const left = Math.random() * window.innerWidth;
                const delay = Math.random() * 2;
                const duration = Math.random() * 1 + 1;
                const height = Math.random() * 100 + 50;
                
                raindrop.style.left = left + 'px';
                raindrop.style.height = height + 'px';
                raindrop.style.animationDelay = delay + 's';
                raindrop.style.animationDuration = duration + 's';
                
                rainContainer.appendChild(raindrop);
            }
        }

        createRain();

        let tabCounter = 1;

        async function loadProxy(url = null) {
            const urlInput = url || document.getElementById('urlInput').value.trim();
            if (!urlInput) return;

            let processedUrl = urlInput;
            if (!processedUrl.startsWith('http://') && !processedUrl.startsWith('https://')) {
                processedUrl = 'https://' + processedUrl;
            }

            try {
                const encodedUrl = proxy ? proxy.prefix + __uv$config.encodeUrl(processedUrl) : processedUrl;
                
                // Show tabs
                document.getElementById('tabsContainer').style.display = 'flex';
                
                // Create new tab
                createTab(encodedUrl, processedUrl);
                
                // Hide input section
                document.querySelector('.input-section').style.display = 'none';
                
            } catch (error) {
                console.error('Proxy error:', error);
                document.getElementById('errorMessage').textContent = 'Failed to load the requested website.';
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        function createTab(url, displayUrl) {
            const tabsContainer = document.getElementById('tabsContainer');
            const frameContainer = document.getElementById('frameContainer');
            
            // Create tab
            const tab = document.createElement('button');
            tab.className = 'tab';
            tab.innerHTML = `
                <span>${displayUrl.split('/')[2] || 'Tab ' + tabCounter}</span>
                <span class="tab-close" onclick="closeTab(this)">×</span>
            `;
            tab.onclick = () => switchTab(tab, url);
            
            tabsContainer.appendChild(tab);
            tabsContainer.insertBefore(tab, document.getElementById('newTabBtn'));
            
            // Show frame
            frameContainer.style.display = 'block';
            
            // Load URL
            switchTab(tab, url);
            
            tabCounter++;
        }

        function switchTab(tab, url) {
            // Update active tab
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            
            // Load URL in iframe
            const iframe = document.getElementById('proxyFrame');
            iframe.src = url;
        }

        function closeTab(element) {
            event.stopPropagation();
            const tab = element.parentElement;
            const tabsContainer = document.getElementById('tabsContainer');
            
            if (tab.classList.contains('active')) {
                const nextTab = tab.nextElementSibling || tab.previousElementSibling;
                if (nextTab && nextTab.id !== 'newTabBtn') {
                    nextTab.click();
                } else {
                    // No more tabs, show input
                    document.querySelector('.input-section').style.display = 'flex';
                    document.getElementById('frameContainer').style.display = 'none';
                    document.getElementById('tabsContainer').style.display = 'none';
                }
            }
            
            tab.remove();
        }

        document.getElementById('newTabBtn').addEventListener('click', function() {
            document.querySelector('.input-section').style.display = 'flex';
            document.getElementById('frameContainer').style.display = 'none';
        });

        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadProxy();
            }
        });

        // Load saved settings
        document.addEventListener('DOMContentLoaded', function() {
            const bgColor = localStorage.getItem('backgroundColor') || '#0a0a1f';
            document.body.style.backgroundColor = bgColor;
            
            const siteTitle = localStorage.getItem('siteTitle') || 'Waterbottle Proxy';
            document.title = siteTitle;
            
            const savedLogo = localStorage.getItem('siteLogo');
            if (savedLogo) {
                const faviconLink = document.createElement('link');
                faviconLink.rel = 'icon';
                faviconLink.href = savedLogo;
                document.head.appendChild(faviconLink);
            }
        });
    </script>
</body>
</html>
