<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web OS Dock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="desktop">
    <div id="windows">
      <div class="window hidden" data-app="helios">
        <div class="title">
          <div class="traffic">
            <button class="traffic-btn red" aria-label="Close"></button>
            <button class="traffic-btn yellow" aria-label="Minimize"></button>
            <button class="traffic-btn green" aria-label="Maximize"></button>
          </div>
          <img class="title-icon" src="https://helios-browser.vercel.app/favicon.ico" alt="Helios icon" />
          <span class="title-text">Helios Browser</span>
        </div>
        <div class="content">
          <iframe class="app-frame" src="https://dev-xomxo.vercel.app/Helios-Offline.html" title="Helios Browser" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
        </div>
      </div>

      <div class="window hidden" data-app="penguinmod">
        <div class="title">
          <div class="traffic">
            <button class="traffic-btn red" aria-label="Close"></button>
            <button class="traffic-btn yellow" aria-label="Minimize"></button>
            <button class="traffic-btn green" aria-label="Maximize"></button>
          </div>
          <img class="title-icon" src="https://penguinmod.com/favicon.ico" alt="PenguinMod icon" />
          <span class="title-text">PenguinMod</span>
        </div>
        <div class="content">
          <iframe class="app-frame" src="https://penguinmod.com" title="PenguinMod" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
        </div>
      </div>

      <!-- Waterbottle Proxy app (embeds local index (1).html) -->
      <div class="window hidden" data-app="waterbottle">
        <div class="title">
          <div class="traffic">
            <button class="traffic-btn red" aria-label="Close"></button>
            <button class="traffic-btn yellow" aria-label="Minimize"></button>
            <button class="traffic-btn green" aria-label="Maximize"></button>
          </div>
          <!-- text icon used instead of image -->
          <span class="title-text">Waterbottle Proxy</span>
        </div>
        <div class="content">
          <iframe class="app-frame" src="/index (1).html" title="Waterbottle Proxy" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
        </div>
      </div>
    </div>

    <div id="dock-wrap">
      <div id="dock">
        <button class="dock-item" data-app="helios" aria-label="Helios Browser">
          <img src="https://helios-browser.vercel.app/favicon.ico" alt="Helios">
        </button>
        <button class="dock-item" data-app="penguinmod" aria-label="PenguinMod">
          <img src="https://penguinmod.com/favicon.ico" alt="PenguinMod">
        </button>
        <!-- Waterbottle dock icon: text-based "W" cyan -->
        <button class="dock-item" data-app="waterbottle" aria-label="Waterbottle Proxy">
          <div class="text-icon" aria-hidden="true">W</div>
        </button>
      </div>
    </div>
  </div>

  <!-- custom cursor overlays everything (positioned via JS) -->
  <img id="custom-cursor" src="cursor.png" alt="" aria-hidden="true" />

  <script type="module" src="app.js"></script>
</body>
</html>
